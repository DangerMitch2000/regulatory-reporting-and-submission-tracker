body{margin:0;padding:24px;background:#e7edf3;font:14px 'Segoe UI',sans-serif}nav{max-width:1440px;margin:0 auto 20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}nav strong{margin-right:auto}nav button{padding:8px 12px;border:1px solid #c9d4e1;background:white;border-radius:6px;color:#17324d;cursor:pointer}#host{width:min(1440px,100%);height:800px;margin:0 auto;border:1px solid #d6e0eb;box-shadow:0 10px 40px #18365314;border-radius:9px}.demo-note{max-width:1440px;margin:18px auto;color:#536a80} </style></head><body><nav><strong>Preview · fictional submissions</strong><button id="wide">Wide preview</button><button id="small">Compact preview</button><button id="clean">Reset demo</button><button id="review">Data checks example</button><button id="missing">Missing Submission IDs example</button></nav><div id="host"></div><p class="demo-note">Demonstration data only. The months follow your computer's current date. Import the Power BI package and map your real submission fields to see actual counts.</p><script>(()=>{
const DEFAULT_SITES = ['ABO', 'ADJ', 'ADK', 'AJG', 'ARDG', 'SCR'];
const STATE_FIELDS = [{role:'SubStatus',label:'Submission state'}, {role:'ROStatus',label:'RO state'}, {role:'AppStatus',label:'Application state'}];
const DISPATCH_ROLES = ['DispatchRequired', 'PlannedDispatch', 'ActualDispatch'];
const REGISTRATION_ROLES = ['RegistrationID', 'RegistrationCountry', 'RegistrationStatus', 'RegistrationStart', 'RegistrationEnd'];
const REGISTRATION_COMPLETE_STATES = ['Approved', 'Conditionally Approved'];
const IDENTIFIER_FIELDS = [{role:'ROID',label:'RO ID'},{role:'AppID',label:'Application ID'}];
const SCOPE_ROLES = ['Product', 'CommercialRegion'];
const ROLES = ['SubID', 'Site', 'PlannedSubmission', 'ActualSubmission', 'BusinessUnit', ...STATE_FIELDS.map(f=>f.role), ...DISPATCH_ROLES, ...REGISTRATION_ROLES, 'FallbackCountry', ...IDENTIFIER_FIELDS.map(field=>field.role), ...SCOPE_ROLES];
const REQUIRED = ROLES.slice(0, 4);
const clean = value => String(value ?? '').trim();
const siteKey = value => clean(value).toLocaleUpperCase('en-GB');
function normalizeStateFilters(filters = {}) {
  return Object.fromEntries(STATE_FIELDS.map(({role}) => [role, Array.isArray(filters?.[role]) ? [...new Set(filters[role].filter(v=>typeof v==='string').map(clean))] : null]));
}
const stateLabel = value => value || 'Not recorded';
function formatStates(values) {
  if (!values) return 'Not mapped';
  return (values.length > 1 ? 'Multiple: ' : '') + values.map(stateLabel).join(' / ');
}
// Use all delivered state evidence for a submission, before local filter selections.
const hasState = (states, role, value) => Boolean(states[role]?.some(state => clean(state).replace(/\s+/g, ' ').toLocaleLowerCase('en-GB') === value));
const SUBMITTED_STATES = ['Completed', 'HA Received', 'Sent To Health Authority', 'Rejected'];
const submittedStateEvidence = states => SUBMITTED_STATES.filter(label => hasState(states, 'SubStatus', label.toLocaleLowerCase('en-GB')));
function parseDay(value) {
  if (value == null || clean(value) === '') return {kind: 'blank'};
  let y, m, d;
  if (value instanceof Date) {
    if (!Number.isFinite(+value)) return {kind: 'invalid'};
    [y, m, d] = [value.getUTCFullYear(), value.getUTCMonth() + 1, value.getUTCDate()];
  } else {
    const text=clean(value), iso=text.match(/^(\d{4})-(\d{2})-(\d{2})(.*)$/), local=text.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})(.*)$/);
    if(!iso&&!local)return {kind:'invalid'};
    const match=iso||local;
    [y,m,d]=iso?match.slice(1,4).map(Number):[Number(match[3]),Number(match[2]),Number(match[1])];
    if(match[4]){
      const time=match[4].match(/^[T ](\d{2}):(\d{2})(?::(\d{2})(?:\.(\d{1,9}))?)?(Z|[+-]\d{2}:?\d{2})?$/);
      if(!time||Number(time[1])>23||Number(time[2])>59||Number(time[3]||0)>59)return {kind:'invalid'};
      if(time[5]&&time[5]!=='Z'){
        const offset=time[5].replace(':','');
        if(Number(offset.slice(1,3))>23||Number(offset.slice(3))>59)return {kind:'invalid'};
      }
    }
  }
  const check=new Date(0);check.setUTCFullYear(y,m-1,d);check.setUTCHours(0,0,0,0);const day=+check;
  return check.getUTCFullYear() === y && check.getUTCMonth() === m - 1 && check.getUTCDate() === d
    ? {kind: 'date', day} : {kind: 'invalid'};
}
function resolveDate(values) {
  const parsed = values.map(parseDay), days = [...new Set(parsed.filter(x => x.kind === 'date').map(x => x.day))];
  if (parsed.some(x => x.kind === 'invalid')) return {kind: 'issue', reason: 'Invalid date'};
  if (days.length > 1) return {kind: 'issue', reason: 'Conflicting dates'};
  return days.length ? {kind: 'date', day: days[0]} : {kind: 'blank'};
}
// Keep each delivered registration's fields together: never borrow an ID, state or
// country from another joined row. Repeated joins must not inflate submissions.
function registrationReviews(rows,mapped,identifiers){
  const index=new Map();
  if(!mapped.RegistrationID)return index;
  for(const row of rows){
    const id=clean(row.RegistrationID);if(!id)continue;
    if(!index.has(id))index.set(id,{states:new Set(),ros:new Set(),apps:new Set()});
    const evidence=index.get(id),state=mapped.RegistrationStatus?clean(row.RegistrationStatus).toLowerCase().replace(/\s+/g,' '):'';
    if(state)evidence.states.add(state);
    if(identifiers?.ROID&&clean(row.ROID))evidence.ros.add(clean(row.ROID));
    if(identifiers?.AppID&&clean(row.AppID))evidence.apps.add(clean(row.AppID));
  }
  return new Map([...index].map(([id,evidence])=>[id,[
    ...(evidence.states.size>1?['Conflicting states for the same registration ID']:[]),
    ...(evidence.ros.size>1?['Registration ID is associated with multiple RO IDs']:[]),
    ...(evidence.apps.size>1?['Registration ID is associated with multiple application IDs']:[])
  ]]));
}
function registrationEvidence(rows, mapped = Object.fromEntries(REGISTRATION_ROLES.map(role=>[role,true])), identifiers = {ROID:true,AppID:true}, reviews = registrationReviews(rows,mapped,identifiers)) {
  const distinct = new Map();
  for (const row of rows) {
    const values = Object.fromEntries(REGISTRATION_ROLES.map(role=>[role,mapped[role] ? row[role] : null]));
    if (!Object.values(values).some(value=>clean(value))) continue;
    const key = JSON.stringify(REGISTRATION_ROLES.map(role=>values[role] instanceof Date && Number.isFinite(+values[role]) ? values[role].toISOString() : clean(values[role])));
    if (distinct.has(key)) continue;
    const id=clean(values.RegistrationID), country=clean(values.RegistrationCountry), state=clean(values.RegistrationStatus);
    const start=mapped.RegistrationStart?resolveDate([values.RegistrationStart]):{kind:'unmapped'}, end=mapped.RegistrationEnd?resolveDate([values.RegistrationEnd]):{kind:'unmapped'};
    const complete=Boolean(id && REGISTRATION_COMPLETE_STATES.some(value=>value.toLowerCase()===state.toLowerCase().replace(/\s+/g,' ')));
    const notes=[...(reviews.get(id)||[])];
    if(start.kind==='issue')notes.push(`${start.reason}: registration start`);
    if(end.kind==='issue')notes.push(`${end.reason}: registration end`);
    if(start.kind==='date'&&end.kind==='date'&&end.day<start.day)notes.push('Registration end date is before its start date');
    if(!id && state)notes.push('Registration ID not recorded; state alone cannot identify the linked registration');
    distinct.set(key,{id,country,state,start,end,complete,notes,rawStart:clean(values.RegistrationStart),rawEnd:clean(values.RegistrationEnd)});
  }
  const records=[...distinct.values()].sort((a,b)=>a.id.localeCompare(b.id,undefined,{numeric:true})||a.country.localeCompare(b.country)||a.state.localeCompare(b.state)||a.rawStart.localeCompare(b.rawStart)||a.rawEnd.localeCompare(b.rawEnd));
  return {records, qualifying:records.filter(record=>record.complete), notes:[...new Set(records.flatMap(record=>record.notes.map(note=>`${record.id||'Registration without ID'}: ${note}`)))]};
}
function resolveCountry(rows, registration, fallbackMapped = true) {
  const distinct=values=>[...new Map(values.map(clean).filter(Boolean).map(value=>[value.toLocaleLowerCase('en-GB'),value])).values()].sort((a,b)=>a.localeCompare(b));
  const primary=distinct(registration.records.map(record=>record.country));
  if(primary.length)return {values:primary,source:'Registration country'};
  const secondary=fallbackMapped?distinct(rows.map(row=>row.FallbackCountry)):[];
  return {values:secondary,source:secondary.length?'Secondary country':'Not recorded'};
}
function relatedEvidence(rows, mapped) {
  const pairs=new Map();
  for(const row of rows){
    const roId=mapped.ROID?clean(row.ROID):'', appId=mapped.AppID?clean(row.AppID):'';
    if(roId||appId)pairs.set(JSON.stringify([roId,appId]),{roId,appId});
  }
  const relatedRecords=[...pairs.values()].sort((a,b)=>a.roId.localeCompare(b.roId,undefined,{numeric:true})||a.appId.localeCompare(b.appId,undefined,{numeric:true}));
  const relatedIds=Object.fromEntries(IDENTIFIER_FIELDS.map(({role})=>[role,mapped[role]?[...new Set(relatedRecords.map(pair=>role==='ROID'?pair.roId:pair.appId).filter(Boolean))].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true})):null]));
  return {relatedIds,relatedRecords};
}
function resolveRequired(values, mapped = true) {
  if (!mapped) return {kind: 'unmapped', values: []};
  const recorded = [...new Set(values.map(clean).filter(Boolean))];
  if (!recorded.length) return {kind: 'blank', values: []};
  const normalized = recorded.map(value => {
    const text = value.toLowerCase().replace(/\s+/g, ' ');
    return ['yes', 'true', '1', 'required'].includes(text) ? true : ['no', 'false', '0', 'not required'].includes(text) ? false : null;
  });
  if (normalized.includes(null)) return {kind: 'issue', reason: 'Unrecognized dispatch requirement', values: recorded};
  if (new Set(normalized).size > 1) return {kind: 'issue', reason: 'Conflicting dispatch requirements', values: recorded};
  return {kind: 'value', required: normalized[0], values: recorded};
}
const overdueGroup = () => ({count: 0, internal: 0, authority: 0, unclassified: 0, rows: []});
const addOverdue = (group, record) => {group.count++; group[record.overdueStage]++; group.rows.push(record);};
function dispatchProgress(record, today) {
  const d = record.dispatch, notes = [], required = d.required, actual = d.actual, plan = d.planned;
  if (required.kind === 'issue') notes.push(required.reason);

function sample(now = new Date()) {
  const y = now.getFullYear(), m = now.getMonth(), currentDay = now.getDate(), iso = (offset, day) => new Date(Date.UTC(y, m + offset, day)).toISOString().slice(0, 10);
  const planned = [[16, 8], [10, 6], [26, 20], [14, 6], [5, 4], [24, 12]], submitted = [[7, 0], [0, 1], [11, 2], [0, 0], [1, 0], [2, 1]], rows = [];
  DEFAULT_SITES.forEach((site, si) => planned[si].forEach((n, mi) => {
    for (let i = 0; i < n; i++) {
      const row = {SubID: `DEMO-${site}-${mi+1}-${String(i+1).padStart(3,'0')}`, Site: site, PlannedSubmission: iso(mi, i%27+1), ActualSubmission: i < submitted[si][mi] ? iso(0, Math.min(3,currentDay)) : null, BusinessUnit: i%7 ? 'ID' : 'CMI'};
      rows.push(row); if (i%9===0) rows.push({...row});
    }
  }));
  DEFAULT_SITES.forEach((site, si) => {
    for (let i = 0; i < [5,3,12,4,2,8][si]; i++) {
      const row = {SubID: `DEMO-${site}-BACKLOG-${String(i+1).padStart(3,'0')}`, Site: site, PlannedSubmission: iso(i%2 ? -3 : -1, i%27+1), ActualSubmission: null, BusinessUnit: i%4 ? 'ID' : 'CMI'};
      rows.push(row); if (i%3===0) rows.push({...row});
    }

  });
  const states = new Map();
  const enriched = rows.map(row => {
    if (!states.has(row.SubID)) {
      const i = states.size;
      states.set(row.SubID, {
        SubStatus: row.ActualSubmission ? 'Completed' : ['In Progress','Planned','Ready For Submission','Cancelled','Withdrawn','Inactive',null][i%7],
        ROStatus: row.ActualSubmission ? 'Health Authority Approved' : ['In Progress','Planned','Archived','Rejected','On Hold By Health Authority'][i%5],
        AppStatus: i%6 ? 'Active' : 'Inactive',
        DispatchRequired: i%3 === 0 ? 'No' : 'Yes',
        PlannedDispatch: new Date(Date.parse(row.PlannedSubmission)-14*86400000).toISOString().slice(0,10),
        ActualDispatch: row.ActualSubmission ? row.ActualSubmission : i%3===2 ? iso(-1,1) : null
      });
    }
    const registration=row.SubID==='DEMO-ABO-1-001'?{RegistrationID:'DEMO-REG-001',RegistrationCountry:'Ireland',RegistrationStatus:'Approved',RegistrationStart:iso(-1,1),RegistrationEnd:iso(12,1)}:row.SubID==='DEMO-ADJ-2-001'?{RegistrationID:'DEMO-REG-002',RegistrationCountry:'Germany',RegistrationStatus:'Conditionally Approved',RegistrationStart:iso(0,1),RegistrationEnd:iso(12,1)}:{};
    return {...row,Product:['Demo assay A','Demo assay B','Demo assay C'][DEFAULT_SITES.indexOf(row.Site)%3],CommercialRegion:DEFAULT_SITES.indexOf(row.Site)%2?'Americas':'EMEA',ROID:'DEMO-RO-'+row.SubID.slice(5),AppID:'DEMO-APP-'+row.Site,...states.get(row.SubID),FallbackCountry:['France','Spain','Germany','Italy','Poland','Ireland'][DEFAULT_SITES.indexOf(row.Site)],...registration};
  });
  // These old plans have no actual date but are complete for backlog purposes.
  return [...enriched,
    {SubID:'DEMO-CLOSED-BY-SUB',Site:'ABO',PlannedSubmission:iso(-1,1),ActualSubmission:null,BusinessUnit:'ID',SubStatus:'Completed',ROStatus:'In Progress',AppStatus:'Active'},
    {SubID:'DEMO-CLOSED-BY-RO',Site:'ADJ',PlannedSubmission:iso(-1,1),ActualSubmission:null,BusinessUnit:'ID',SubStatus:'In Progress',ROStatus:'Health Authority Approved',AppStatus:'Active'},
    {SubID:'DEMO-CLOSED-BY-BOTH',Site:'ADK',PlannedSubmission:iso(-1,1),ActualSubmission:null,BusinessUnit:'ID',SubStatus:'Completed',ROStatus:'Health Authority Approved',AppStatus:'Active'}
  ];
}
