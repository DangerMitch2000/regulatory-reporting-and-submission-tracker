.change-dashboard .cd-country-link-note{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--cd-muted);padding:6px 12px;border-bottom:1px solid var(--cd-line);overflow-wrap:anywhere}
.change-dashboard .cd-countries tr[data-related=true]>td:first-child{box-shadow:inset 3px 0 var(--cd-accent)}
.change-dashboard .cd-countries tr[data-related=false]{opacity:.55}
.change-dashboard .cd-countries tr[data-selected=true]{opacity:1}

/* Both planning dates stay visible in the same column without widening the list. */
.change-dashboard .cd-planning-item+.cd-planning-item{margin-top:6px}
.change-dashboard .cd-planning-label{display:block;color:var(--cd-muted);font-size:11px;line-height:1.25;white-space:normal}
.change-dashboard .cd-planning-value{display:block;line-height:1.35;white-space:normal}
.change-dashboard .cd-planning-details{padding:0 16px;border-bottom:1px solid var(--cd-line)}
.change-dashboard .cd-planning-details summary{padding:7px 0}
.change-dashboard .cd-planning-details dl{padding-bottom:8px}
.change-dashboard .cd-planning-details p{font-size:11px;color:var(--cd-muted);padding-bottom:9px}

/* Compact spacing preserves text sizes and the worklist/diagram viewing areas. */
.change-dashboard .cd-header{padding:10px 14px 8px;gap:10px}
.change-dashboard .cd-meta{max-width:78%}
.change-dashboard .cd-meta-info{display:flex;justify-content:flex-end;align-items:center;gap:3px 12px;flex-wrap:wrap;margin-top:2px}
.change-dashboard .cd-meta-info .cd-theme{margin-top:0;gap:5px}
.change-dashboard .cd-filters{padding:0 14px 8px;gap:8px}
.change-dashboard label{gap:3px}
.change-dashboard select{padding:5px 8px;min-height:32px}
.change-dashboard .cd-theme select{min-height:28px}
.change-dashboard .cd-body{padding:8px 14px}
.change-dashboard .cd-filter-tools{margin-bottom:6px}
.change-dashboard .cd-metrics{gap:8px}
.change-dashboard .cd-metric{display:grid;grid-template-columns:max-content minmax(0,1fr);column-gap:12px;row-gap:1px;padding:9px 12px;align-items:center}
.change-dashboard .cd-metric strong{grid-row:1 / 3}
.change-dashboard .cd-metric span{grid-column:2}
.change-dashboard .cd-count-note{margin:5px 0 8px}
.change-dashboard .cd-list-head{margin-bottom:6px;gap:8px}
.change-dashboard .cd-selection{gap:6px}
.change-dashboard .cd-switch button{padding:5px 9px;min-height:28px}
.change-dashboard .cd-linkbtn{padding:5px 9px;min-height:30px}
.change-dashboard .cd-sort-note{margin-bottom:5px}
.change-dashboard th{padding:7px 10px}
.change-dashboard .cd-change-table td{padding:6px 10px}
.change-dashboard .cd-change-table th:nth-child(1){width:22%}
.change-dashboard .cd-change-table th:nth-child(2){width:13%}
.change-dashboard .cd-change-table th:nth-child(3){width:18%}
.change-dashboard .cd-change-table th:nth-child(4){width:12%}
.change-dashboard .cd-change-table th:nth-child(5){width:12%}
.change-dashboard .cd-change-table th:nth-child(6){width:23%}
.change-dashboard .cd-planning-item+.cd-planning-item{margin-top:3px}
.change-dashboard .cd-related-counts{gap:1px 8px}
.change-dashboard .cd-related-count{min-height:24px}
.change-dashboard .cd-page{padding:5px 0;gap:8px}
.change-dashboard .cd-detail{margin-top:8px}
.change-dashboard .cd-detail-head{padding:9px 12px;gap:8px}
.change-dashboard .cd-detail-head .cd-small{margin-top:2px}
.change-dashboard .cd-related-records,.change-dashboard .cd-planning-details{padding-left:12px;padding-right:12px}
.change-dashboard summary{padding:7px 0}
.change-dashboard .cd-planning-details summary{padding:6px 0}
.change-dashboard .cd-countries td{padding:7px 10px}
.change-dashboard .cd-evidence{padding:10px 12px}
.change-dashboard .cd-evidence h3{margin-bottom:5px}
.change-dashboard .cd-evidence-card{padding:7px 0}
.change-dashboard .cd-evidence-card dl{margin-top:7px}
.change-dashboard dl{gap:7px 12px}
.change-dashboard .cd-action{padding:8px 10px;margin-bottom:8px}
.change-dashboard .cd-source-fields{margin-top:7px}
.change-dashboard .cd-graph-toolbar{gap:6px 10px;margin-bottom:5px}
.change-dashboard .cd-graph-context{display:flex;align-items:flex-start;gap:6px 16px;flex-wrap:wrap;margin-bottom:5px}
.change-dashboard .cd-graph-context .cd-graph-selection,.change-dashboard .cd-graph-context .cd-graph-hint{flex:1;min-width:220px;margin:0}
.change-dashboard .cd-graph-context .cd-graph-legend{margin:0;flex:none}
.change-dashboard .cd-graph-context .cd-graph-legend[open]{flex-basis:100%}
.change-dashboard .cd-graph-selection{gap:5px 8px}
.change-dashboard .cd-graph-selection span{margin-top:1px}
.change-dashboard .cd-graph-pages{gap:4px 14px;padding:5px 0}
.change-dashboard .cd-graph-note{margin-bottom:6px}
.change-dashboard .cd-unlinked{margin-top:6px}
.change-dashboard .cd-footer{margin-top:8px}
.change-dashboard[data-compact=true] .cd-header{align-items:flex-start}
.change-dashboard[data-compact=true] .cd-meta{max-width:65%}
.change-dashboard[data-narrow=true] .cd-header{padding:8px 10px;gap:5px}
.change-dashboard[data-narrow=true] .cd-meta{max-width:100%;width:100%;text-align:left}
.change-dashboard[data-narrow=true] .cd-meta-info{justify-content:flex-start}
.change-dashboard[data-narrow=true] .cd-filters{gap:6px 8px;padding-bottom:8px}
.change-dashboard[data-narrow=true] .cd-body{padding:8px 10px}
.change-dashboard[data-narrow=true] .cd-metric{display:flex;gap:3px;padding:7px;align-items:flex-start}
.change-dashboard[data-narrow=true] .cd-graph-context{gap:4px 8px}
@media(pointer:coarse){.change-dashboard button,.change-dashboard select,.change-dashboard .cd-theme select,.change-dashboard .cd-related-count,.change-dashboard .cd-switch button,.change-dashboard .cd-linkbtn,.change-dashboard .cd-heading-actions button,.change-dashboard .cd-graph-pages button,.change-dashboard .cd-graph-toolbar input,.change-dashboard th input{min-height:44px}}

/* Taller visual frames give related records more room, without padding sparse groups. */
.change-dashboard .cd-relationship-host{width:100%;min-width:0}
.change-dashboard .cd-change-table [data-main-record]{cursor:pointer}
.change-dashboard .cd-graph-scroll{width:100%;min-width:0}
.change-dashboard .cd-graph-scroll{max-height:var(--cd-related-height,440px)}
.change-dashboard .cd-linked-ids{max-height:var(--cd-related-list-height,360px)}
.change-dashboard .cd-filters{position:relative;z-index:10}
.change-dashboard .cd-filter-menu{position:absolute;z-index:30;display:flex;flex-direction:column;min-width:0;overflow:hidden;border:1px solid var(--cd-line);border-radius:6px;background:var(--cd-bg);color:var(--cd-fg);box-shadow:0 8px 24px #0005;font:13px/1.4 "Segoe UI",sans-serif}
.change-dashboard .cd-filter-search{flex:0 0 auto;width:calc(100% - 12px);min-width:0;margin:6px;padding:7px 8px;min-height:32px;border:1px solid var(--cd-line);border-radius:4px;background:var(--cd-surface);color:var(--cd-fg);font:inherit}
.change-dashboard .cd-filter-search::placeholder{color:var(--cd-muted)}
.change-dashboard .cd-filter-options{min-height:0;overflow:auto;overscroll-behavior:contain;padding:3px 0}
.change-dashboard .cd-filter-option{padding:7px 10px;min-height:32px;overflow-wrap:anywhere;cursor:pointer;border-left:3px solid transparent}
.change-dashboard .cd-filter-option[aria-selected=true]{font-weight:600;border-left-color:var(--cd-accent)}
.change-dashboard .cd-filter-option[data-active=true],.change-dashboard .cd-filter-option:hover{background:var(--cd-soft);outline:1px solid var(--cd-accent);outline-offset:-1px}
.change-dashboard .cd-filter-empty{padding:10px;color:var(--cd-muted)}
.change-dashboard[data-high-contrast=true] .cd-filter-menu{border-color:var(--cd-fg);box-shadow:none}
@media(pointer:coarse){.change-dashboard .cd-filter-option,.change-dashboard .cd-filter-search{min-height:44px}}
