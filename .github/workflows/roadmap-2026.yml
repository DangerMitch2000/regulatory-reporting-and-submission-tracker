name: Build 2026 Roadmap
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'roadmap-*'
      - 'prepare-preview.cjs'
      - 'make-standalone.cjs'
      - 'test-next.cjs'
      - 'test-render.cjs'
      - 'test-host.cjs'
      - '.github/workflows/roadmap-2026.yml'
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate separate Roadmap project
        run: |
          node roadmap-2026.build.cjs
          node roadmap-2026.verify.cjs
          node make-standalone.cjs
      - name: Install pinned build tools
        working-directory: roadmap-2026
        run: npm install
      - name: Test classification and type checking
        working-directory: roadmap-2026
        run: |
          npm test
          npx tsc --noEmit
          npx esbuild src/visual.ts --bundle --platform=node --format=cjs --outfile=verify/visual-host.cjs --loader:.less=empty
          node ../test-host.cjs
      - name: Verify actual visual
        working-directory: roadmap-2026
        run: |
          npx esbuild verify/harness.ts --bundle --outfile=verify/harness.js --loader:.less=css
          npx playwright install --with-deps chromium
          node verify/run.cjs
      - name: Package visual
        working-directory: roadmap-2026
        run: npm run package -- --verbose
      - name: Prepare separate release assets
        run: |
          mkdir -p roadmap-release
          cp roadmap-2026/dist/*.pbiviz roadmap-release/roadmap-2026-1.2.3.0.pbiviz
          cp roadmap-2026/README.md roadmap-release/ROADMAP-INSTALL.md
          cp roadmap-2026/verify/roadmap-preview.png roadmap-release/roadmap-preview.png
          cp roadmap-2026/verify/roadmap-preview-small.png roadmap-release/roadmap-preview-small.png
          cp roadmap-preview.html roadmap-release/roadmap-demo.html
          tar --exclude=node_modules --exclude=.tmp --exclude=dist -czf roadmap-release/roadmap-2026-source.tar.gz roadmap-2026 roadmap-2026.build.cjs roadmap-2026.verify.cjs roadmap-2026.logic.js roadmap-2026.ui.js roadmap-2026.css roadmap-2026.README.md test-next.cjs test-render.cjs test-host.cjs prepare-preview.cjs make-standalone.cjs
          cd roadmap-release && sha256sum * > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: roadmap-2026-package-1.2.3
          path: roadmap-release/
      - name: Publish separate Roadmap preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create roadmap-2026-v1.2.3 --target "$GITHUB_SHA" --prerelease --title "Registration Overview 1.2.3 — Clear category definitions" --notes "Adds visible definitions for Unconfirmed and Inferred in the interactive visual and PowerPoint screenshot layout. Definitions describe dispatch-date evidence, not submission or RO completion status. Missing Dates remains a separate outside-chart count. Calculations, counts, field mappings and filter behavior are unchanged; no status roles are added. Includes fictional interactive demo and source. Calculation tests, compiled host lifecycle tests, real-browser host tests and official Power BI package build passed. Regulatory Tracker is unchanged. Uncertified preview: actual Power BI import and tenant compatibility still require verification. See ROADMAP-INSTALL.md."
          gh release upload roadmap-2026-v1.2.3 roadmap-release/*
