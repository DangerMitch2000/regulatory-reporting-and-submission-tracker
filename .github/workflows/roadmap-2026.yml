name: Build 2026 Roadmap
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'roadmap-*'
      - 'prepare-preview.cjs'
      - 'make-standalone.cjs'
      - 'test-next.cjs'
      - 'test-render.cjs'
      - 'test-host.cjs'
      - '.github/workflows/roadmap-2026.yml'
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate separate Roadmap project
        run: |
          node roadmap-2026.build.cjs
          node roadmap-2026.verify.cjs
          node make-standalone.cjs
      - name: Install pinned build tools
        working-directory: roadmap-2026
        run: npm install
      - name: Test classification and type checking
        working-directory: roadmap-2026
        run: |
          npm test
          npx tsc --noEmit
          npx esbuild src/visual.ts --bundle --platform=node --format=cjs --outfile=verify/visual-host.cjs --loader:.less=empty
          node ../test-host.cjs
      - name: Verify actual visual
        working-directory: roadmap-2026
        run: |
          npx esbuild verify/harness.ts --bundle --outfile=verify/harness.js --loader:.less=css
          npx playwright install --with-deps chromium
          node verify/run.cjs
      - name: Package visual
        working-directory: roadmap-2026
        run: npm run package -- --verbose
      - name: Prepare separate release assets
        run: |
          mkdir -p roadmap-release
          cp roadmap-2026/dist/*.pbiviz roadmap-release/roadmap-2026-1.3.0.0.pbiviz
          cp roadmap-2026/README.md roadmap-release/ROADMAP-INSTALL.md
          cp roadmap-2026/verify/roadmap-preview.png roadmap-release/roadmap-preview.png
          cp roadmap-2026/verify/roadmap-preview-small.png roadmap-release/roadmap-preview-small.png
          cp roadmap-2026/verify/roadmap-status-review.png roadmap-release/roadmap-status-review.png
          cp roadmap-2026/verify/roadmap-status-review-small.png roadmap-release/roadmap-status-review-small.png
          cp roadmap-preview.html roadmap-release/roadmap-demo.html
          tar --exclude=node_modules --exclude=.tmp --exclude=dist -czf roadmap-release/roadmap-2026-source.tar.gz roadmap-2026 roadmap-2026.build.cjs roadmap-2026.verify.cjs roadmap-2026.logic.js roadmap-2026.ui.js roadmap-2026.css roadmap-2026.README.md roadmap-status.verify.cjs test-next.cjs test-render.cjs test-host.cjs prepare-preview.cjs make-standalone.cjs
          cd roadmap-release && sha256sum * > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: roadmap-2026-package-1.3.0
          path: roadmap-release/
      - name: Publish separate Roadmap preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create roadmap-2026-v1.3.0 --target "$GITHUB_SHA" --prerelease --title "Registration Overview 1.3.0 — Status review" --notes "Adds optional SubStatus and ROStatus mappings and a Status review view for investigating dispatch-date gaps. Monthly stacked bars can be coloured by submission or RO status, retaining each record's existing dispatch month. Missing Dates uses horizontal status-count bars without assigning a month. Filter by scope, Site, submission status, RO status or search; inspect a 25-row paged worklist with source statuses and date evidence. The chart and both status summaries count distinct submissions, including the RO-status breakdown. Unmapped, blank and conflicting status values remain distinct. Status-review screenshot mode shows the chart, summaries and filter context without the detailed worklist. Existing dispatch classifications and counts are unchanged; statuses do not invent dispatch dates or mark child submissions complete from an RO state. Includes fictional interactive demo, preview images and source. Calculation tests, compiled host lifecycle tests, real-browser host tests and official Power BI package build passed. Regulatory Tracker is unchanged. Uncertified preview: actual Power BI import and tenant compatibility still require verification. See ROADMAP-INSTALL.md."
          gh release upload roadmap-2026-v1.3.0 roadmap-release/*
