name: Build Power BI visual
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'dispatch-required*'
      - 'tracker-dispatch.verify.cjs'
      - 'tracker-calendar-day.verify.cjs'
      - 'timeline.json'
      - 'predictions.js'
      - 'quality*.js'
      - 'quality*.cjs'
      - 'index.html'
      - 'style.css'
      - 'test-timeline-theme.cjs'
      - 'test-timeline-prediction.cjs'
      - 'open-end-test.cjs'
      - 'tracker-theme.verify.cjs'
      - 'prediction-test.cjs'
      - 'submission-period*'
      - 'powerbi-visual*'
      - '.github/workflows/powerbi-visual.yml'
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate project from demo sources
        run: |
          node open-end-test.cjs
          node dispatch-required-test.cjs
          node quality-test.cjs
          node quality-ui-test.cjs
          node prediction-test.cjs
          node submission-period-test.cjs
          node test-timeline-prediction.cjs
          node test-timeline-theme.cjs
          node powerbi-visual.build.cjs
          node powerbi-visual.verify.cjs
      - name: Install pinned build tools
        working-directory: powerbi-visual
        run: npm install
      - name: Verify field mapping
        working-directory: powerbi-visual
        run: |
          npm test
          npx tsc --noEmit
      - name: Test actual visual in browser host
        working-directory: powerbi-visual
        run: |
          npx esbuild verify/harness.ts --bundle --outfile=verify/harness.js --loader:.less=css
          npx playwright install --with-deps chromium
          node verify/run.cjs
      - name: Preserve verified interface previews
        uses: actions/upload-artifact@v4
        with:
          name: verified-interface-previews
          path: powerbi-visual/verify/*.png
      - name: Build official Power BI package
        working-directory: powerbi-visual
        run: npm run package -- --verbose
      - name: Prepare release files
        run: |
          mkdir -p release
          cp powerbi-visual/dist/*.pbiviz release/regulatory-tracker-1.10.1.0.pbiviz
          cp powerbi-visual/README.md release/POWER-BI-INSTALL.md
          cp powerbi-visual/verify/calendar-day-quality.png release/calendar-day-quality.png
          cp powerbi-visual/verify/dispatch-required.png release/dispatch-required.png
          cp powerbi-visual/verify/overview.png release/powerbi-overview.png
          cp powerbi-visual/verify/light-theme.png release/powerbi-light-theme.png
          cp powerbi-visual/verify/light-details.png release/powerbi-light-details.png
          cp powerbi-visual/verify/light-quality.png release/powerbi-light-quality.png
          cp powerbi-visual/verify/details.png release/powerbi-details.png
          cp powerbi-visual/verify/comparison.png release/powerbi-comparison.png
          cp powerbi-visual/verify/quality.png release/powerbi-data-quality.png
          cp powerbi-visual/verify/prediction-details.png release/prediction-details.png
          cp powerbi-visual/verify/prediction-alongside-plans.png release/prediction-alongside-plans.png
          cp powerbi-visual/verify/approval-benchmark.png release/approval-benchmark.png
          cp powerbi-visual/verify/planned-submission-forecast.png release/planned-submission-forecast.png
          cp powerbi-visual/verify/submission-date-filter.png release/submission-date-filter.png
          tar --exclude=node_modules --exclude=.tmp --exclude=dist --exclude=verify -czf release/regulatory-timeline-powerbi-source.tar.gz powerbi-visual powerbi-visual.build.cjs powerbi-visual.verify.cjs dispatch-required.js dispatch-required-test.cjs tracker-dispatch.verify.cjs tracker-calendar-day.verify.cjs tracker-theme.verify.cjs test-timeline-theme.cjs predictions.js prediction-test.cjs submission-period.js submission-period-test.cjs quality.js quality-ui.js quality-test.cjs quality-ui-test.cjs open-end-test.cjs
          cd release && sha256sum * > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: regulatory-timeline-powerbi
          path: release/
      - name: Publish preview package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v1.10.1 >/dev/null 2>&1; then
            gh release create v1.10.1 --target "$GITHUB_SHA" --prerelease --title "Regulatory Tracker 1.10.1" --notes "Data quality compares the recorded calendar day for dispatch, submission and approval dates, ignoring time of day and ISO timezone offsets. Same-day milestones and duplicate timestamps are accepted; genuinely earlier days, differing recorded days and invalid dates remain flagged. Original source values and CSV evidence are preserved. Power BI Date objects use their UTC calendar day. Registration expiry, timeline and prediction calculations are unchanged. Calculation, adapter, TypeScript and actual-Visual browser checks passed. Built from commit $GITHUB_SHA."
          else
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/v1.10.1" -f sha="$GITHUB_SHA" -F force=false
            gh release edit v1.10.1 --target "$GITHUB_SHA" --notes "Data quality compares the recorded calendar day for dispatch, submission and approval dates, ignoring time of day and ISO timezone offsets. Same-day milestones and duplicate timestamps are accepted; genuinely earlier days, differing recorded days and invalid dates remain flagged. Original source values and CSV evidence are preserved. Power BI Date objects use their UTC calendar day. Registration expiry, timeline and prediction calculations are unchanged. Calculation, adapter, TypeScript and actual-Visual browser checks passed. Built from commit $GITHUB_SHA."
          fi
          gh release upload v1.10.1 release/* --clobber

