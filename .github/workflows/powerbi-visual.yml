name: Build Power BI visual
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'date-format*'
      - 'text-wrap*'
      - 'hierarchy-navigation*'
      - 'vega-test-setup.cjs'
      - 'tracker-column-layout.verify.cjs'
      - 'tracker-count-navigation.verify.cjs'
      - 'presentation*'
      - 'compact-timeline-test.cjs'
      - 'tracker-layout.verify.cjs'
      - 'tracker-host-loading.verify.cjs'
      - 'tracker-browser-helpers.cjs'
      - 'registrations*'
      - 'registration-timeline-test.cjs'
      - 'tracker-registration.verify.cjs'
      - 'continuation*'
      - 'assessment-responses*'
      - 'tracker-assessment-progress.verify.cjs'
      - 'states*'
      - 'tracker-states.verify.cjs'
      - 'changes*'
      - 'tracker-changes.verify.cjs'
      - 'tracker-survey-country.verify.cjs'
      - 'tracker-performance.verify.cjs'
      - 'performance-test.cjs'
      - 'retained-records-test.cjs'
      - 'tracker-retained-records.verify.cjs'
      - 'events*'
      - 'tracker-events.verify.cjs'
      - 'preparation*'
      - 'tracker-preparation.verify.cjs'
      - 'dispatch-details*'
      - 'tracker-dispatch-details.verify.cjs'
      - 'dispatch-required*'
      - 'tracker-dispatch.verify.cjs'
      - 'tracker-calendar-day.verify.cjs'
      - 'timeline.json'
      - 'predictions.js'
      - 'quality*.js'
      - 'quality*.cjs'
      - 'index.html'
      - 'style.css'
      - 'test-timeline-theme.cjs'
      - 'test-timeline-prediction.cjs'
      - 'open-end-test.cjs'
      - 'tracker-theme.verify.cjs'
      - 'prediction-test.cjs'
      - 'submission-period*'
      - 'powerbi-visual*'
      - 'RELEASE-NOTES.md'
      - '.github/workflows/powerbi-visual.yml'
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate project from demo sources
        run: |
          node date-format-test.cjs
          node text-wrap-test.cjs
          node hierarchy-navigation-test.cjs
          node open-end-test.cjs
          node registrations-test.cjs
          node presentation-test.cjs
          node compact-timeline-test.cjs
          node registration-timeline-test.cjs
          node continuation-test.cjs
          node dispatch-details-test.cjs
          node states-test.cjs
          node events-test.cjs
          node changes-test.cjs
          node assessment-responses-test.cjs
          node performance-test.cjs
          node retained-records-test.cjs
          node preparation-test.cjs
          node dispatch-required-test.cjs
          node quality-test.cjs
          node quality-ui-test.cjs
          node prediction-test.cjs
          node submission-period-test.cjs
          node test-timeline-prediction.cjs
          node test-timeline-theme.cjs
          node powerbi-visual.build.cjs
          node powerbi-visual.verify.cjs
      - name: Install pinned build tools
        working-directory: powerbi-visual
        run: npm install
      - name: Verify field mapping
        working-directory: powerbi-visual
        run: |
          npm test
          node ../powerbi-visual-host-test.cjs
          npx tsc --noEmit
      - name: Test actual visual in browser host
        working-directory: powerbi-visual
        run: |
          npx esbuild verify/harness.ts --bundle --outfile=verify/harness.js --loader:.less=css
          npx playwright install --with-deps chromium
          node verify/run.cjs
          cd ..
          TRACKER_BROWSER_CHANNEL=chromium node continuation-browser-test.cjs
          TRACKER_BROWSER_CHANNEL=chromium node tracker-column-layout.verify.cjs
      - name: Preserve verified interface previews
        uses: actions/upload-artifact@v4
        with:
          name: verified-interface-previews
          path: powerbi-visual/verify/*.png
      - name: Build official Power BI package
        working-directory: powerbi-visual
        run: npm run package -- --verbose
      - name: Prepare release files
        run: |
          mkdir -p release
          cp powerbi-visual/dist/*.pbiviz release/regulatory-tracker-1.18.1.0.pbiviz
          cp powerbi-visual/README.md release/POWER-BI-INSTALL.md
          cp RELEASE-NOTES.md release/RELEASE-NOTES.md
          cp powerbi-visual/verify/preparation-light.png release/preparation-light.png
          cp powerbi-visual/verify/changes-dark.png release/changes-dark.png
          cp powerbi-visual/verify/changes-light.png release/changes-light.png
          cp powerbi-visual/verify/states-dark.png release/states-dark.png
          cp powerbi-visual/verify/states-light.png release/states-light.png
          cp powerbi-visual/verify/preparation-dark.png release/preparation-dark.png
          cp powerbi-visual/verify/dispatch-details.png release/dispatch-details.png
          cp powerbi-visual/verify/calendar-day-quality.png release/calendar-day-quality.png
          cp powerbi-visual/verify/dispatch-required.png release/dispatch-required.png
          cp powerbi-visual/verify/registrations-dark.png release/registrations-dark.png
          cp powerbi-visual/verify/registrations-light.png release/registrations-light.png
          cp powerbi-visual/verify/layout-dark-1536.png release/layout-dark-1536.png
          cp powerbi-visual/verify/layout-dark-760.png release/layout-dark-760.png
          cp powerbi-visual/verify/layout-light-1536.png release/layout-light-1536.png
          cp powerbi-visual/verify/layout-light-760.png release/layout-light-760.png
          cp powerbi-visual/verify/overview.png release/powerbi-overview.png
          cp powerbi-visual/verify/light-theme.png release/powerbi-light-theme.png
          cp powerbi-visual/verify/light-details.png release/powerbi-light-details.png
          cp powerbi-visual/verify/light-quality.png release/powerbi-light-quality.png
          cp powerbi-visual/verify/details.png release/powerbi-details.png
          cp powerbi-visual/verify/comparison.png release/powerbi-comparison.png
          cp powerbi-visual/verify/quality.png release/powerbi-data-quality.png
          cp powerbi-visual/verify/prediction-details.png release/prediction-details.png
          cp powerbi-visual/verify/prediction-alongside-plans.png release/prediction-alongside-plans.png
          cp powerbi-visual/verify/approval-benchmark.png release/approval-benchmark.png
          cp powerbi-visual/verify/planned-submission-forecast.png release/planned-submission-forecast.png
          cp powerbi-visual/verify/submission-date-filter.png release/submission-date-filter.png
          tar --exclude=node_modules --exclude=.tmp --exclude=dist --exclude=verify -czf release/regulatory-timeline-powerbi-source.tar.gz app.js index.html style.css timeline.json sample.json vega.js VEGA-LICENSE.txt README.md CHANGELOG.md RELEASE-NOTES.md .github/workflows/powerbi-visual.yml test-timeline-prediction.cjs date-format.js date-format-test.cjs text-wrap.js text-wrap-test.cjs hierarchy-navigation.js hierarchy-navigation-test.cjs vega-test-setup.cjs tracker-column-layout.verify.cjs tracker-count-navigation.verify.cjs registrations.js registrations-test.cjs presentation.js presentation-test.cjs compact-timeline-test.cjs tracker-layout.verify.cjs tracker-host-loading.verify.cjs tracker-browser-helpers.cjs registration-timeline-test.cjs tracker-registration.verify.cjs continuation-test.cjs continuation-browser-test.cjs retained-records-test.cjs tracker-retained-records.verify.cjs tracker-performance.verify.cjs performance-test.cjs assessment-responses.js assessment-responses-test.cjs tracker-assessment-progress.verify.cjs changes.js changes-test.cjs tracker-changes.verify.cjs tracker-survey-country.verify.cjs states.js states-test.cjs tracker-states.verify.cjs events.js events-test.cjs tracker-events.verify.cjs powerbi-visual powerbi-visual.build.cjs powerbi-visual.verify.cjs powerbi-visual-host-test.cjs dispatch-required.js dispatch-required-test.cjs dispatch-details.js dispatch-details-test.cjs preparation.js preparation-test.cjs tracker-preparation.verify.cjs tracker-dispatch-details.verify.cjs tracker-dispatch.verify.cjs tracker-calendar-day.verify.cjs tracker-theme.verify.cjs test-timeline-theme.cjs predictions.js prediction-test.cjs submission-period.js submission-period-test.cjs quality.js quality-ui.js quality-test.cjs quality-ui-test.cjs open-end-test.cjs
          cd release && sha256sum * > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: regulatory-timeline-powerbi
          path: release/
      - name: Publish preview package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=v1.18.1
          remote_tag=$(git ls-remote origin "refs/tags/$tag" "refs/tags/$tag^{}")
          if [ -n "$remote_tag" ]; then
            git fetch --no-tags origin "refs/tags/$tag"
            tag_commit=$(git rev-parse 'FETCH_HEAD^{commit}')
            if [ "$tag_commit" != "$GITHUB_SHA" ]; then
              echo "Refusing to move $tag: it points to $tag_commit, not $GITHUB_SHA." >&2
              exit 1
            fi
          else
            git tag "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --verify-tag --prerelease --title "Regulatory Tracker 1.18.1" --notes-file RELEASE-NOTES.md
          fi
          existing_assets=$(gh release view "$tag" --json assets --jq '.assets[].name')
          asset_check=$(mktemp -d)
          trap 'rm -rf "$asset_check"' EXIT
          for file in release/*; do
            asset=$(basename "$file")
            if printf '%s\n' "$existing_assets" | grep -Fxq "$asset"; then
              gh release download "$tag" --pattern "$asset" --dir "$asset_check"
              if ! cmp -s "$file" "$asset_check/$asset"; then
                echo "Refusing to replace published asset $asset. Use a new version for changed files." >&2
                exit 1
              fi
            else
              gh release upload "$tag" "$file"
            fi
          done

