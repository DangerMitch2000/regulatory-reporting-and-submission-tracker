name: Build Power BI visual
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'timeline.json'
      - 'predictions.js'
      - 'prediction-test.cjs'
      - 'powerbi-visual*'
      - '.github/workflows/powerbi-visual.yml'
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate project from demo sources
        run: |
          node prediction-test.cjs
          node test-timeline-prediction.cjs
          node powerbi-visual.build.cjs
          node powerbi-visual.verify.cjs
      - name: Install pinned build tools
        working-directory: powerbi-visual
        run: npm install
      - name: Verify field mapping
        working-directory: powerbi-visual
        run: |
          npm test
          npx tsc --noEmit
      - name: Test actual visual in browser host
        working-directory: powerbi-visual
        run: |
          npx esbuild verify/harness.ts --bundle --outfile=verify/harness.js --loader:.less=css
          npx playwright install --with-deps chromium
          node verify/run.cjs
      - name: Preserve verified interface previews
        uses: actions/upload-artifact@v4
        with:
          name: verified-interface-previews
          path: powerbi-visual/verify/*.png
      - name: Build official Power BI package
        working-directory: powerbi-visual
        run: npm run package -- --verbose
      - name: Prepare release files
        run: |
          mkdir -p release
          cp powerbi-visual/dist/*.pbiviz release/regulatory-tracker-1.6.0.0.pbiviz
          cp powerbi-visual/README.md release/POWER-BI-INSTALL.md
          cp powerbi-visual/verify/overview.png release/powerbi-overview.png
          cp powerbi-visual/verify/details.png release/powerbi-details.png
          cp powerbi-visual/verify/prediction-details.png release/prediction-details.png
          tar --exclude=node_modules --exclude=.tmp --exclude=dist --exclude=verify -czf release/regulatory-timeline-powerbi-source.tar.gz powerbi-visual powerbi-visual.build.cjs powerbi-visual.verify.cjs predictions.js prediction-test.cjs
          cd release && sha256sum * > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: regulatory-timeline-powerbi
          path: release/
      - name: Publish preview package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v1.6 >/dev/null 2>&1; then
            gh release create v1.6 --target "$GITHUB_SHA" --prerelease --title "Regulatory Tracker 1.6" --notes "Regulatory Tracker 1.6: Business Unit filter, bounded product search, one main heading, country-based median approval estimates with historical ranges and supporting Details. Dates are screened from 2020 to today; at least 10 distinct eligible country records are required. Estimates never replace recorded plans or actuals. Forecasts are descriptive, not validated guarantees. Official Microsoft package build and browser host checks passed. Import into Power BI Desktop to verify tenant and host compatibility; this is an uncertified preview, not a Deneb JSON file. See POWER-BI-INSTALL.md. Clipboard depends on the host; selectable detail text remains available. Built from commit $GITHUB_SHA."
          else
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/v1.6" -f sha="$GITHUB_SHA" -F force=false
            gh release edit v1.6 --target "$GITHUB_SHA" --notes "Regulatory Tracker 1.6: Business Unit filter, bounded product search, one main heading, country-based median approval estimates with historical ranges and supporting Details. Dates are screened from 2020 to today; at least 10 distinct eligible country records are required. Estimates never replace recorded plans or actuals. Forecasts are descriptive, not validated guarantees. Official Microsoft package build and browser host checks passed. Import into Power BI Desktop to verify tenant and host compatibility; this is an uncertified preview, not a Deneb JSON file. See POWER-BI-INSTALL.md. Clipboard depends on the host; selectable detail text remains available. Built from commit $GITHUB_SHA."
          fi
          gh release upload v1.6 release/* --clobber

