name: Build Power BI visual
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'timeline.json'
      - 'predictions.js'
      - 'quality*.js'
      - 'quality*.cjs'
      - 'index.html'
      - 'style.css'
      - 'test-timeline-theme.cjs'
      - 'tracker-theme.verify.cjs'
      - 'prediction-test.cjs'
      - 'submission-period*'
      - 'powerbi-visual*'
      - '.github/workflows/powerbi-visual.yml'
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate project from demo sources
        run: |
          node quality-test.cjs
          node quality-ui-test.cjs
          node prediction-test.cjs
          node submission-period-test.cjs
          node test-timeline-prediction.cjs
          node test-timeline-theme.cjs
          node powerbi-visual.build.cjs
          node powerbi-visual.verify.cjs
      - name: Install pinned build tools
        working-directory: powerbi-visual
        run: npm install
      - name: Verify field mapping
        working-directory: powerbi-visual
        run: |
          npm test
          npx tsc --noEmit
      - name: Test actual visual in browser host
        working-directory: powerbi-visual
        run: |
          npx esbuild verify/harness.ts --bundle --outfile=verify/harness.js --loader:.less=css
          npx playwright install --with-deps chromium
          node verify/run.cjs
      - name: Preserve verified interface previews
        uses: actions/upload-artifact@v4
        with:
          name: verified-interface-previews
          path: powerbi-visual/verify/*.png
      - name: Build official Power BI package
        working-directory: powerbi-visual
        run: npm run package -- --verbose
      - name: Prepare release files
        run: |
          mkdir -p release
          cp powerbi-visual/dist/*.pbiviz release/regulatory-tracker-1.9.0.0.pbiviz
          cp powerbi-visual/README.md release/POWER-BI-INSTALL.md
          cp powerbi-visual/verify/overview.png release/powerbi-overview.png
          cp powerbi-visual/verify/light-theme.png release/powerbi-light-theme.png
          cp powerbi-visual/verify/light-details.png release/powerbi-light-details.png
          cp powerbi-visual/verify/light-quality.png release/powerbi-light-quality.png
          cp powerbi-visual/verify/details.png release/powerbi-details.png
          cp powerbi-visual/verify/comparison.png release/powerbi-comparison.png
          cp powerbi-visual/verify/quality.png release/powerbi-data-quality.png
          cp powerbi-visual/verify/prediction-details.png release/prediction-details.png
          cp powerbi-visual/verify/prediction-alongside-plans.png release/prediction-alongside-plans.png
          cp powerbi-visual/verify/approval-benchmark.png release/approval-benchmark.png
          cp powerbi-visual/verify/planned-submission-forecast.png release/planned-submission-forecast.png
          cp powerbi-visual/verify/submission-date-filter.png release/submission-date-filter.png
          tar --exclude=node_modules --exclude=.tmp --exclude=dist --exclude=verify -czf release/regulatory-timeline-powerbi-source.tar.gz powerbi-visual powerbi-visual.build.cjs powerbi-visual.verify.cjs tracker-theme.verify.cjs test-timeline-theme.cjs predictions.js prediction-test.cjs submission-period.js submission-period-test.cjs quality.js quality-ui.js quality-test.cjs quality-ui-test.cjs
          cd release && sha256sum * > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: regulatory-timeline-powerbi
          path: release/
      - name: Publish preview package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v1.9.0 >/dev/null 2>&1; then
            gh release create v1.9.0 --target "$GITHUB_SHA" --prerelease --title "Regulatory Tracker 1.9.0" --notes "Regulatory Tracker 1.9.0: whole-visual Dark and Light themes selected at the top-right. Dark is the default for new visual instances. Timeline, filters, menus, Details, approval estimates, tooltips and Data quality follow the selected theme. Light uses higher-contrast status colours while state identities and all calculations remain unchanged. Theme switching preserves filters, selection, pins and timeline position; resize and data refresh retain the selected theme. The choice is local to each instance and is not saved across report reopening. Calculation, adapter, TypeScript, theme and actual-class browser checks passed. This is an uncertified Power BI preview; verify import in your report. Built from commit $GITHUB_SHA."
          else
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/v1.9.0" -f sha="$GITHUB_SHA" -F force=false
            gh release edit v1.9.0 --target "$GITHUB_SHA" --notes "Regulatory Tracker 1.9.0: whole-visual Dark and Light themes selected at the top-right. Dark is the default for new visual instances. Timeline, filters, menus, Details, approval estimates, tooltips and Data quality follow the selected theme. Light uses higher-contrast status colours while state identities and all calculations remain unchanged. Theme switching preserves filters, selection, pins and timeline position; resize and data refresh retain the selected theme. The choice is local to each instance and is not saved across report reopening. Calculation, adapter, TypeScript, theme and actual-class browser checks passed. This is an uncertified Power BI preview; verify import in your report. Built from commit $GITHUB_SHA."
          fi
          gh release upload v1.9.0 release/* --clobber
