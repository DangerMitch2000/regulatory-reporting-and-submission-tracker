name: Build IVDR Registration Overview
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a new version after its version and release tag have been updated'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'ivdr-overview/**'
      - 'shared/dispatch-required.js'
      - '.github/workflows/ivdr-comparison.yml'
  pull_request:
    paths:
      - 'ivdr-overview/**'
      - 'shared/dispatch-required.js'
      - '.github/workflows/ivdr-comparison.yml'
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ivdr-overview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate separate IVDR project
        run: |
          node ivdr-comparison.build.cjs
          node ivdr-demo.cjs
      - name: Install pinned build tools
        working-directory: ivdr-overview/ivdr-comparison
        run: npm install
      - name: Check calculations and actual visual
        run: |
          node ivdr-test.cjs
          cd ivdr-comparison
          npx tsc --noEmit
          npx esbuild src/visual.ts --bundle --platform=node --format=cjs --outfile=verify/visual-host.cjs --loader:.less=empty
          node ../ivdr-host-test.cjs
          npx esbuild verify/harness.ts --bundle --outfile=verify/harness.js --loader:.less=css
          npx playwright install --with-deps chromium
          node ../ivdr-browser-test.cjs
          npm run package
      - name: Prepare release
        run: |
          mkdir -p ivdr-release
          cp ivdr-comparison/dist/*.pbiviz ivdr-release/ivdr-registration-overview-1.2.1.0.pbiviz
          cp README.md ivdr-release/IVDR-INSTALL.md
          cp ivdr-preview.html ivdr-release/ivdr-demo.html
          cp ivdr-comparison/verify/ivdr-preview.png ivdr-release/ivdr-preview.png
          cp ivdr-comparison/verify/ivdr-preview-small.png ivdr-release/ivdr-preview-small.png
          tar --exclude=node_modules --exclude=.tmp --exclude=dist --exclude='ivdr-overview/ivdr-release' -czf ivdr-release/ivdr-source.tar.gz -C .. ivdr-overview shared
          cd ivdr-release && sha256sum * > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ivdr-registration-overview
          path: ivdr-overview/ivdr-release/
      - name: Publish separate preview release
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ivdr-overview-v1.2.1 --target "$GITHUB_SHA" --prerelease --title "IVDR Registration Overview 1.2.1 — Wallace Sans typography" --notes "Uses Wallace Sans throughout the visual, including controls, charts and Screenshot mode, with Wallace Sans Light at weight 300 for the main title. Uses locally available fonts with Segoe UI, Arial and sans-serif fallbacks; no font assets or network downloads are included. Visual GUID, field mappings and calculations are unchanged. Includes fictional demo, source and mapping guide. Calculation, compiled host and browser checks passed before packaging. Actual Power BI mapping requires verification."
          gh release upload ivdr-overview-v1.2.1 ivdr-release/*

