name: Build Site Submission Outlook
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site-submission-outlook/**'
      - '.github/workflows/site-submission-outlook.yml'
permissions:
  contents: write
concurrency:
  group: site-submission-outlook-release
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: site-submission-outlook
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate Power BI project and preview
        run: |
          node build.cjs
          node prepare-preview.cjs
          git diff --exit-code -- preview.html
      - name: Install pinned build tools
        timeout-minutes: 5
        working-directory: site-submission-outlook/powerbi
        run: npm install
      - name: Install test browser
        timeout-minutes: 5
        working-directory: site-submission-outlook/powerbi
        run: npx playwright install chromium
      - name: Verify calculations and visual interactions
        run: |
          node logic-test.mjs
          npm --prefix powerbi run typecheck
          node prepare-tests.cjs
          node browser-test.cjs
      - name: Build Power BI package
        working-directory: site-submission-outlook/powerbi
        run: npm run package -- --no-stats
      - name: Verify the actual packaged runtime
        run: |
          unzip 'powerbi/dist/*.pbiviz' -d package-check
          node package-test.cjs
      - name: Prepare release files
        run: |
          mkdir -p release
          cp powerbi/dist/*.pbiviz release/site-submission-outlook-1.2.2.0.pbiviz
          cp README.md release/SITE-SUBMISSION-OUTLOOK-INSTALL.md
          cp preview.html release/site-submission-outlook-demo.html
          cp site-submission-outlook-preview.png release/site-submission-outlook-preview.png
          tar --exclude=node_modules --exclude=.tmp --exclude=dist -czf release/site-submission-outlook-source.tar.gz powerbi submissions.logic.mjs submissions.ui.mjs submissions.css visual.ts build.cjs demo.mjs preview-entry.mjs prepare-preview.cjs preview.html prepare-tests.cjs logic-test.mjs browser-test.cjs package-test.cjs serve.cjs README.md RELEASE-NOTES.md
          cd release
          sha256sum * > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: site-submission-outlook-1.2.2
          path: site-submission-outlook/release/
      - name: Publish separate Site Submission Outlook release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: site-submission-outlook-v1.2.2
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft,targetCommitish > release-state.json 2>/dev/null; then
            node -e 'const fs=require("fs"),r=JSON.parse(fs.readFileSync("release-state.json"));if(!r.isDraft||r.targetCommitish!==process.env.GITHUB_SHA)throw Error("This version already exists. Bump the version instead of replacing it.")'
          else
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --draft --title "Site Submission Outlook 1.2.2" --notes-file RELEASE-NOTES.md
          fi
          gh release upload "$RELEASE_TAG" release/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
