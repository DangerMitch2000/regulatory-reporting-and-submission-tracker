name: Build Key Submissions 2026
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a new version after its version and release tag have been updated'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'shared/dispatch-required.js'
      - 'key-submissions/**'
      - '.github/workflows/key-submissions.yml'
  pull_request:
    paths:
      - 'key-submissions/**'
      - 'shared/dispatch-required.js'
      - '.github/workflows/key-submissions.yml'
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: key-submissions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate separate Key Submissions project
        run: |
          node key-submissions.build.cjs
          node key-demo.cjs
      - name: Install pinned build tools
        working-directory: key-submissions/key-submissions
        run: npm install
      - name: Verify scope and actual visual
        run: |
          node key-test.cjs
          cd key-submissions
          npx tsc --noEmit
          npx esbuild src/visual.ts --bundle --platform=node --format=cjs --outfile=verify/visual-host.cjs --loader:.less=empty
          node ../key-host-test.cjs
          npx esbuild verify/harness.ts --bundle --outfile=verify/harness.js --loader:.less=css
          npx playwright install --with-deps chromium
          node ../key-browser-test.cjs
          npm run package
      - name: Prepare separate release
        run: |
          mkdir -p key-release
          cp key-submissions/dist/*.pbiviz key-release/key-submissions-2026-1.1.1.0.pbiviz
          cp README.md key-release/KEY-SUBMISSIONS-INSTALL.md
          cp key-preview.html key-release/key-demo.html
          cp key-submissions/verify/key-preview.png key-release/key-preview.png
          cp key-submissions/verify/key-dispatch-details.png key-release/key-dispatch-details.png
          tar --exclude=node_modules --exclude=.tmp --exclude=dist --exclude='key-submissions/key-release' -czf key-release/key-source.tar.gz -C .. key-submissions shared
          cd key-release && sha256sum * > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: key-submissions-2026
          path: key-submissions/key-release/
      - name: Publish Key Submissions preview
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create key-submissions-2026-v1.1.1 --target "$GITHUB_SHA" --prerelease --title "Key Submissions — 2026 (ID) 1.1.1" --notes "Uses Wallace Sans throughout the visual and Wallace Sans Light at weight 300 for the main title, matching Site Submission Outlook. Segoe UI, Arial and sans-serif remain local fallbacks; no fonts are bundled or downloaded. Visual identity, field roles and calculations are unchanged. See KEY-SUBMISSIONS-INSTALL.md."
          gh release upload key-submissions-2026-v1.1.1 key-release/*

