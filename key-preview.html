 const dispatchFilter=state.dispatchFilter||'all',dispatchLabel=dispatchOptions.find(o=>o.key===dispatchFilter)?.label||'All';
 root.replaceChildren();root.className='keyView';const header=el('header'),title=el('div');title.append(el('h1','Key Submissions — 2026'),el('p','ID · 2026 · Dispatch required: '+dispatchLabel,'scope'));header.append(title);root.append(header);

const rows=Array.from({length:30},(_,i)=>({SubID:'KEY-'+String(i+1).padStart(3,'0'),ROID:'RO-'+String(i+1).padStart(3,'0'),KeySubmission:'Key Submissions',BusinessUnit:'ID',DispatchRequired:i%5===0?false:i%5===1?null:true,Product:['Diagnostic panel','Portable reader','Screening assay','Laboratory test kit'][i%4]+' '+(i+1),Country:['France','Germany','Spain','Italy','Ireland'][i%5],Site:['Northern site','Southern site'][i%2],SubStatus:['Planned','In Progress','Sent To Health Authority'][i%3],LatestDispatch:i===0?null:'2026-01-10',ActualDispatch:i%3?'2026-01-12':null,LatestSubmission:'2026-'+String(i%9+2).padStart(2,'0')+'-15',ActualSubmission:i%3===2?'2026-02-12':null,LatestApproval:'2026-11-20'}));rows.push({...rows[0],Product:'Additional assay',Country:'Portugal'});rows.push({...rows[1],SubID:'NON-KEY',KeySubmission:'Non-Key Submissions'});rows.push({...rows[1],SubID:'OTHER-BU',BusinessUnit:'CMI'});rows.push({...rows[1],SubID:'OTHER-YEAR',ActualDispatch:'2027-01-01'});const root=document.getElementById('host');let state={query:'',page:0,selected:null};function draw(){const active=document.activeElement,focused=active?.type==='search',cursor=focused?active.selectionStart:null;render(root,rows,{state,synthetic:true,onChange:patch=>{state={...state,...patch};draw();if(patch.selected)root.scrollTop=0}});if(focused&&!state.selected){const input=root.querySelector('input');input.focus();if(cursor!==null)input.setSelectionRange(cursor,cursor);}}draw();</script></html>
